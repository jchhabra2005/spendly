{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update this spending entry</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           value="{{ expense.amount }}" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" class="form-input" required>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}"
                            {% if cat.id == expense.category_id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date (DD-MM-YYYY)</label>
                    <input type="text" id="date" name="date" class="form-input"
                           value="{{ expense.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Note (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" value="{{ expense.description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('dashboard') }}">&larr; Back to dashboard</a>
        </p>

    </div>
</section>
{% endblock %}
